<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E10">
<title>传到电视</title>
<style>
  :root {
    --bg: #0E0E10;
    --card: #1C1C1E;
    --line: #2E2E32;
    --text: #FFFFFF;
    --sub: #99FFFFFF;
    --dim: #5CFFFFFF;
    --accent: #0A84FF;
    --ok: #30D158;
    --bad: #FF453A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", "Noto Sans SC", sans-serif;
    padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
    max-width: 620px;
    margin: 0 auto;
  }
  header { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 4px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: .5px; }
  .peer { color: var(--dim); font-size: 13px; }
  .lede { color: var(--sub); font-size: 14px; margin: 0 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 17px; margin: 0 0 4px; }
  .hint { color: var(--dim); font-size: 13px; margin: 0 0 14px; }
  label { display: block; font-size: 13px; color: var(--sub); margin: 12px 0 6px; }
  .file {
    display: block; width: 100%; padding: 14px;
    border: 1px dashed var(--line); border-radius: 12px;
    background: #141416; color: var(--sub); font-size: 14px;
  }
  input[type=file] { width: 100%; font-size: 14px; color: var(--sub); }
  input[type=file]::file-selector-button {
    background: #2C2C2E; color: var(--text); border: 0;
    border-radius: 9px; padding: 9px 14px; margin-right: 12px;
    font: inherit; cursor: pointer;
  }
  textarea, input[type=url], select {
    width: 100%; background: #141416; color: var(--text);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font: inherit; font-size: 15px;
    outline: none;
  }
  textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
  textarea:focus, input[type=url]:focus, select:focus { border-color: var(--accent); }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position: calc(100% - 20px) 20px, calc(100% - 14px) 20px; background-size: 6px 6px; background-repeat: no-repeat; }
  button.primary {
    width: 100%; margin-top: 16px; padding: 14px;
    border: 0; border-radius: 12px; background: var(--accent);
    color: #fff; font: inherit; font-size: 16px; font-weight: 600;
    cursor: pointer;
  }
  button.primary:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }
  #log { margin-top: 4px; }
  .item {
    border-radius: 12px; padding: 12px 14px; margin-top: 10px;
    font-size: 14px; word-break: break-all;
    border: 1px solid var(--line); background: #141416;
  }
  .item.ok { border-color: rgba(48,209,88,.45); }
  .item.bad { border-color: rgba(255,69,58,.5); }
  .item b { font-weight: 600; }
  .item small { display: block; color: var(--dim); margin-top: 3px; }
  footer { color: var(--dim); font-size: 12px; text-align: center; margin-top: 22px; line-height: 1.7; }
  .recent { color: var(--sub); font-size: 13px; }
  .recent div { padding: 6px 0; border-bottom: 1px solid var(--line); word-break: break-all; }
  .recent span { color: var(--dim); margin-right: 8px; }
</style>
</head>
<body>
<header><h1>传到电视</h1><span class="peer" id="peer"></span></header>
<p class="lede">手机与电视连同一个 WiFi。传播放列表文件，或把网址/视频地址发过去。</p>

<div class="card">
  <h2>上传文件</h2>
  <p class="hint">支持 M3U / M3U8 / DPL / TXT 的文本播放列表，一次可选多个。</p>
  <input type="file" id="files" multiple accept=".m3u,.m3u8,.dpl,.txt,.json,text/plain">
  <label for="fileMode">导入为</label>
  <select id="fileMode">
    <option value="playlist">播放列表（自动识别格式）</option>
    <option value="sites">站点清单（每行一个网址）</option>
  </select>
  <button class="primary" id="btnUpload">上传并导入</button>
</div>

<div class="card">
  <h2>发送链接</h2>
  <p class="hint">一行一个，可以一次发多条。视频直链可选「立即在电视播放」。</p>
  <textarea id="links" placeholder="https://example.com/list.m3u&#10;https://example.com/live.m3u8"></textarea>
  <label for="linkMode">导入为</label>
  <select id="linkMode">
    <option value="auto">自动识别</option>
    <option value="site">添加为站点</option>
    <option value="playlist">导入播放列表</option>
    <option value="play">立即在电视播放</option>
  </select>
  <button class="primary" id="btnLink">发送到电视</button>
</div>

<div class="card">
  <h2>结果</h2>
  <div id="log"><div class="item">还没发送任何内容。</div></div>
  <h2 style="margin-top:22px">电视上最近收到的</h2>
  <div class="recent" id="recent">加载中…</div>
</div>

<footer>
  服务只在电视上这个页面打开时运行，退出页面即关闭。<br>
  同一局域网内能访问该端口的设备都可以发送，请勿在公共 WiFi 使用。
</footer>

<script>
(function () {
  'use strict';
  var BASE = location.origin;
  var $ = function (id) { return document.getElementById(id); };

  $('peer').textContent = location.host;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function addItem(ok, title, detail) {
    var box = $('log');
    if (box.dataset.empty === '1' || box.children.length === 1 && box.firstElementChild.className === 'item') {
      box.innerHTML = '';
    }
    box.dataset.empty = '0';
    var d = document.createElement('div');
    d.className = 'item ' + (ok ? 'ok' : 'bad');
    d.innerHTML = '<b>' + (ok ? '✓ ' : '✗ ') + esc(title) + '</b>' +
      (detail ? '<small>' + esc(detail) + '</small>' : '');
    box.insertBefore(d, box.firstChild);
  }

  function busy(btn, on) {
    btn.disabled = on;
    btn.textContent = on ? '发送中…' : btn.dataset.label;
  }

  function post(path, body, isForm) {
    var opt = { method: 'POST', body: body };
    if (!isForm) {
      opt.headers = { 'Content-Type': 'application/json; charset=utf-8' };
    }
    return fetch(BASE + path, opt).then(function (r) {
      return r.json().catch(function () { return { ok: false, message: '服务端返回异常 (HTTP ' + r.status + ')' }; });
    });
  }

  $('btnUpload').dataset.label = '上传并导入';
  $('btnLink').dataset.label = '发送到电视';

  $('btnUpload').addEventListener('click', function () {
    var btn = this;
    var list = $('files').files;
    if (!list.length) { addItem(false, '请先选择文件'); return; }
    var fd = new FormData();
    fd.append('mode', $('fileMode').value);
    for (var i = 0; i < list.length; i++) fd.append('file', list[i], list[i].name);
    busy(btn, true);
    post('/api/upload', fd, true).then(function (res) {
      addItem(res.ok !== false, res.message || '已上传', res.detail || '');
      if (res.ok !== false) $('files').value = '';
      loadRecent();
    }).catch(function (e) {
      addItem(false, '上传失败', String(e));
    }).then(function () { busy(btn, false); });
  });

  $('btnLink').addEventListener('click', function () {
    var btn = this;
    var text = $('links').value.trim();
    if (!text) { addItem(false, '请先填入网址'); return; }
    busy(btn, true);
    post('/api/link', JSON.stringify({ text: text, mode: $('linkMode').value }), false)
      .then(function (res) {
        addItem(res.ok !== false, res.message || '已发送', res.detail || '');
        if (res.ok !== false) $('links').value = '';
        loadRecent();
      }).catch(function (e) {
        addItem(false, '发送失败', String(e));
      }).then(function () { busy(btn, false); });
  });

  function loadRecent() {
    fetch(BASE + '/api/history').then(function (r) { return r.json(); })
      .then(function (res) {
        var box = $('recent');
        var items = res.items || [];
        if (!items.length) { box.textContent = '暂无记录'; return; }
        box.innerHTML = items.map(function (it) {
          return '<div><span>' + esc(it.time || '') + '</span>' + esc(it.text || '') + '</div>';
        }).join('');
      }).catch(function () { $('recent').textContent = '读取失败'; });
  }

  loadRecent();
  setInterval(loadRecent, 5000);
})();
</script>
</body>
</html>
